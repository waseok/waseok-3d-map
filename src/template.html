<title>와석초 3D 배치도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas; one floating control card top-left, room card bottom-left */
:root{
  --bg:#e9eeec; --panel:rgba(255,255,255,.88); --line:#cfd8d5; --fg:#1d2a27; --muted:#5d6e69;
  --accent:#0f7a5c; --accent-fg:#fff; --chip:#f2f5f4;
  --display:"Black Han Sans","Gothic A1",system-ui,sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a19; --panel:rgba(28,36,34,.9); --line:#34423f; --fg:#e6eeeb; --muted:#9db0aa;
  --accent:#4fd1a5; --accent-fg:#0d1b17; --chip:#22302d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --panel:rgba(28,36,34,.9); --line:#34423f; --fg:#e6eeeb; --muted:#9db0aa;
  --accent:#4fd1a5; --accent-fg:#0d1b17; --chip:#22302d; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.panel{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));width:min(300px,calc(100vw - 32px));
  background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);
  border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;letter-spacing:.01em;line-height:1.1}
.sub{color:var(--muted);font-size:.78rem;margin-top:3px}
.lbl{font-size:.68rem;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.floors{display:flex;gap:4px;flex-wrap:wrap}
.floors button{flex:1;min-width:38px;font:600 .85rem var(--body);padding:7px 0;border-radius:8px;border:1px solid var(--line);
  background:var(--chip);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.floors button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mode{background:var(--chip);padding:3px;border-radius:10px;border:1px solid var(--line)}
.mode button{border:0;background:transparent}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0;font:500 .9rem var(--body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--fg)}
.hint{font-size:.74rem;color:var(--muted);min-height:1em}
.row{display:flex;align-items:center;gap:8px;font-size:.8rem}
.row input{flex:1;accent-color:var(--accent)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:.76rem}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.15);flex:none}
.toggle{display:none;font:600 .8rem var(--body);background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.card{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:160px;max-width:calc(100vw - 32px)}
.card b{font-size:1.1rem;display:block}
.card small{color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.78rem;font-weight:600;padding:4px 8px;border-radius:6px;transform:translate(-50%,-140%);white-space:nowrap}
.zoom{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 1.3rem var(--body);cursor:pointer;backdrop-filter:blur(10px)}
.zoom button#zreset{font-size:.72rem}
details.nav summary{cursor:pointer;font-weight:800;font-size:.85rem;list-style:none;display:flex;justify-content:space-between}
details.nav summary::-webkit-details-marker{display:none}
details.nav summary::after{content:'+';color:var(--muted)}details.nav[open] summary::after{content:'\2212'}
.navgrid{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px;align-items:center}
.navgrid input{min-width:0;font:500 .88rem var(--body);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--fg)}
.btn{font:700 .82rem var(--body);padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.navbtns{display:flex;gap:6px;margin-top:6px}.navbtns .primary{flex:1}
#navOut{margin-top:8px;font-size:.8rem}
#navOut ol{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px}
.navhead{font-weight:800;border-left:4px solid var(--c);padding-left:8px;display:flex;flex-direction:column}
.navhead em{font-style:normal;font-weight:600;color:var(--muted);font-size:.74rem}.navhead span{font-weight:600;color:var(--muted);font-size:.75rem}
.cardbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cardbtns button{font:700 .78rem var(--body);padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.cardbtns .evac{background:#13a053;border-color:#13a053;color:#fff}
.hidebtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--muted);font:700 .8rem var(--body);cursor:pointer;flex:none}
.menubtn{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));font:700 .9rem var(--body);padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.viewsel{margin-top:8px}
.stepctl{display:flex;gap:6px;align-items:center;margin-top:6px}.stepctl .btn{flex:1}.stepctl span{font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
ol.stages{list-style:none;padding:0!important;margin-top:8px!important;gap:4px!important}
ol.stages li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
ol.stages li:hover{background:var(--chip)}
ol.stages li.on{background:var(--chip);border-color:var(--fc)}
ol.stages .fl{flex:none;background:var(--fc);color:#fff;font-weight:800;font-size:.72rem;border-radius:6px;padding:2px 6px;margin-top:1px}
.check{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600}
.panel{max-height:calc(100% - 32px);overflow:auto}

.help{position:fixed;right:76px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:.72rem;color:var(--muted);text-align:right}
.more{display:flex;flex-direction:column;gap:12px}
.legend .grades{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;padding-bottom:4px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.navtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.touchhelp{display:none}
/* phones: the menu becomes a bottom sheet; room card and zoom buttons move to the top */
@media (max-width:640px){
  .panel{left:0;right:0;top:auto;bottom:var(--kb,0px);width:auto;max-height:min(62vh,calc(100% - 150px));
    border-radius:18px 18px 0 0;border-bottom:0;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));gap:10px;
    box-shadow:0 -8px 30px rgba(0,0,0,.14)}
  .panel::before{content:'';flex:none;align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
  h1{font-size:1.15rem}
  .sub{display:none}
  .toggle{display:inline-block}
  .touchhelp{display:block}
  .panel.collapsed .opt{display:none}
  /* while a route is shown the sheet only holds the route guide */
  .panel.routing #searchBox,.panel.routing .opt:not(#navBox),.panel.routing #navBox>summary,
  .panel.routing .navgrid,.panel.routing .navbtns,.panel.routing .navhint{display:none}
  .panel.routing.collapsed #navBox{display:block}
  .panel.routing #navOut{margin-top:0}
  .panel.routing[data-view="step"] ol.stages li:not(.on),.panel.routing[data-view="follow"] ol.stages li:not(.on){display:none}
  .panel.routing.collapsed .viewsel,.panel.routing.collapsed ol.stages{display:none}
  .card{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;left:12px;right:68px;min-width:0;max-width:none}
  .zoom{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;right:12px}
  .menubtn{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .help{display:none}
}
/* touch screens: bigger targets, and 16px inputs so iOS does not zoom the page on focus */
@media (pointer:coarse){
  .floors button{padding:11px 0}
  .search input,.navgrid input{font-size:16px;padding:10px 12px}
  .btn{padding:11px 12px}
  .cardbtns button{padding:10px 12px;font-size:.85rem}
  .hidebtn{width:40px;height:40px}
  .toggle{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--chip)}
  .check{min-height:40px}
  .check input{width:22px;height:22px;margin:0}
  details.nav summary{padding:10px 0}
  ol.stages li{padding:10px}
  .zoom button{width:44px;height:44px}
}
</style>

<div id="stage"></div>
<div class="panel" id="panel">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
    <div style="min-width:0;flex:1"><h1>와석초 교실배치도</h1><div class="sub">2026학년도 · 본관·별관·신관 1–5층</div></div>
    <div style="display:flex;gap:10px;align-items:center"><button class="toggle" id="tg" aria-expanded="true">접기</button><button class="hidebtn" id="hideMenu" aria-label="메뉴 숨기기" title="메뉴 숨기기">&#10005;</button></div>
  </div>
  <div id="searchBox">
    <div class="search">
      <input id="q" type="search" enterkeyhint="search" placeholder="교실 찾기 (예: 5-3, 보건실)" autocomplete="off">
    </div>
    <div class="hint" id="hint" style="margin-top:4px"></div>
  </div>
  <div class="floors mode opt" id="mode">
    <button data-m="ext" aria-pressed="true">외관</button>
    <button data-m="plan" aria-pressed="false">교실 배치도</button>
  </div>
  <div id="planUI" class="opt">
    <div class="lbl">층 보기</div>
    <div class="floors" id="floors" style="margin-top:6px"></div>
  </div>
  <label class="check opt" id="ovRow" for="overlay"><input type="checkbox" id="overlay"> 외관 겹쳐 보기</label>
  <label class="row opt" for="op" id="opRow"><span class="lbl">외관 투명도</span><input id="op" type="range" min="0" max="90" step="5" value="0"><span id="opVal" style="width:2.6em;text-align:right;font-variant-numeric:tabular-nums">0%</span></label>
  <details class="nav opt" id="navBox">
    <summary>길찾기 · 비상대피로</summary>
    <div class="navgrid">
      <input id="navFrom" list="places" placeholder="출발 (예: 5-3, 현관)" autocomplete="off">
      <button class="btn" id="navSwap" title="출발과 도착 바꾸기" aria-label="출발과 도착 바꾸기">&#8645;</button>
      <input id="navTo" list="places" placeholder="도착 (예: 보건실, 화장실)" autocomplete="off">
      <span></span>
    </div>
    <div class="navbtns"><button class="btn primary" id="navGo">경로 보기</button><button class="btn" id="navClear">지우기</button></div>
    <div class="hint navhint" style="margin-top:6px">교실을 누르면 <b>비상대피로</b> 버튼이 나와요.</div>
    <div id="navOut" hidden></div>
  </details>
  <datalist id="places"></datalist>
  <div class="more opt">
    <label class="row" for="gap" id="gapRow"><span class="lbl">층 간격</span><input id="gap" type="range" min="1" max="3" step="0.05" value="1.5"></label>
    <div class="legend" id="legend"></div>
    <div class="hint touchhelp">한 손가락: 돌리기 · 두 손가락: 확대·이동 · 교실을 누르면 정보가 나와요</div>
  </div>
</div>
<button class="menubtn" id="showMenu" hidden aria-label="메뉴 열기">&#9776; 메뉴</button>
<div class="card" id="card" hidden></div>
<div class="zoom"><button id="zin" aria-label="확대">+</button><button id="zout" aria-label="축소">&minus;</button><button id="zreset" aria-label="처음 화면으로">처음</button></div>
<div id="tip" hidden></div>
<div class="help">드래그: 회전 · 우클릭/두 손가락: 이동 · 휠: 확대<br>배치도에서 교실을 누르면 정보가 나와요</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATA=__DATA__;
const CAT={'#f6cfdc':'현관·로비',
  '#9ae4c7':'교실','#d8bee3':'특별실','#41c7f1':'화장실','#ffb589':'계단','#ffef99':'행정·지원실',
  '#b9ff1a':'창고·설비·휴게','#a0b4e6':'승강기','#ffffff':'병설유치원','#faf2da':'필로티','#d8d8d8':'복도'};
const NICE={'화(남)':'남자 화장실','화(여)':'여자 화장실','교화(남)':'교직원 화장실(남)','교화(여)':'교직원 화장실(여)','장.화':'장애인 화장실','승':'승강기','EPS':'EPS실(전기 설비)'};
const nice=l=>NICE[l]||l.replace(/^계단(\d)$/,'계단 $1').replace(/^(\d)-(\d+)$/,'$1학년 $2반');
// classrooms take one colour per grade; other classrooms (돌봄·늘봄·학습탐구반) and the busier categories
// are toned down so the grade colours stand apart
const CLASS='#9ae4c7', GRADE_C=['#ffd84a','#9bdc6e','#4fc9ad','#86a9ff','#c79bf0','#ff9a8f'];
const SHOW={[CLASS]:'#cdeee0','#d8bee3':'#ddd2e8','#ffef99':'#efe6c6','#b9ff1a':'#d7e2b5','#a0b4e6':'#b6c1d8'};
const gradeOf=g=>{const m=g.c===CLASS&&g.l.match(/^([1-6])-\d+$/);return m?+m[1]:0;};
const colorOf=g=>{const gr=gradeOf(g);return gr?GRADE_C[gr-1]:SHOW[g.c]||g.c;};

const H=34, ROOM=17, SLAB=1.2, CX=408, CZ=50;
let gapK=1.5;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,1,5000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=60; controls.maxDistance=1600;
scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,0.75));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const sun=new THREE.DirectionalLight(0xffffff,0.6); sun.position.set(-250,500,350); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-450,right:450,top:350,bottom:-350,near:10,far:1500}); scene.add(sun);

function setBg(){scene.background=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());}
setBg(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setBg);
new MutationObserver(setBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// ground + playground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1400,900),new THREE.MeshLambertMaterial({color:0xc9d3cf}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.6; ground.receiveShadow=true; scene.add(ground);
// playground, modeled on the drone photos: turf field, straight red track along the building side,
// white oval line, centre circle, two marked boxes, west goal, sand play area and trees
(function(){
  const X0=326,Z0=68,W=290,D=124,S=10, c=document.createElement('canvas');c.width=W*S;c.height=D*S;
  const g=c.getContext('2d'), P=v=>v*S, px=x=>P(x-X0), pz=z=>P(z-Z0);
  g.fillStyle='#2f8a4c';g.fillRect(px(328),pz(72),P(282),P(102));
  g.fillStyle='#34934f';for(let x=328;x<610;x+=20)g.fillRect(px(x),pz(72),P(10),P(102));
  // red straight track with lanes
  g.fillStyle='#b8473c';g.fillRect(px(340),pz(75),P(262),P(11));
  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=P(0.3);
  for(let k=0;k<=4;k++){const z=75.5+k*2.5;g.beginPath();g.moveTo(px(340),pz(z));g.lineTo(px(602),pz(z));g.stroke();}
  g.lineWidth=P(0.55);g.strokeStyle='#fff';
  const line=(a,b,cc,d)=>{g.beginPath();g.moveTo(px(a),pz(b));g.lineTo(px(cc),pz(d));g.stroke();};
  g.strokeRect(px(334),pz(89),P(270),P(81));
  // oval running line
  const ox0=352,ox1=598,oz0=93,oz1=166,r=(oz1-oz0)/2,cy=(oz0+oz1)/2;
  g.beginPath();g.moveTo(px(ox0+r),pz(oz0));g.lineTo(px(ox1-r),pz(oz0));g.arc(px(ox1-r),pz(cy),P(r),-Math.PI/2,Math.PI/2);
  g.lineTo(px(ox0+r),pz(oz1));g.arc(px(ox0+r),pz(cy),P(r),Math.PI/2,Math.PI*1.5);g.stroke();
  line(472,89,472,170);
  g.beginPath();g.arc(px(472),pz(cy),P(9),0,Math.PI*2);g.stroke();
  g.strokeRect(px(414),pz(108),P(30),P(38));line(414,127,444,127);
  g.strokeRect(px(500),pz(106),P(40),P(42));line(500,127,540,127);
  g.strokeRect(px(334),pz(116),P(12),P(26));
  // sand play area
  g.fillStyle='#d8c39a';g.fillRect(px(430),pz(176),P(160),P(14));
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const m=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({map:tex,transparent:true}));
  m.rotation.x=-Math.PI/2;m.position.set(X0+W/2-CX,-0.35,Z0+D/2-CZ);m.receiveShadow=true;scene.add(m);
  const white=new THREE.MeshLambertMaterial({color:0xffffff}),blue=new THREE.MeshLambertMaterial({color:0x2f6fb5});
  const box=(w,h,d,x,y,z,mat)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);b.position.set(x-CX,y,z-CZ);b.castShadow=true;scene.add(b);return b;};
  // goal at the west end
  box(0.5,4,0.5,336,2,125.4,white);box(0.5,4,0.5,336,2,132.6,white);box(0.5,0.5,7.7,336,4,129,white);
  const net=new THREE.Mesh(new THREE.PlaneGeometry(7.2,4),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.35,side:THREE.DoubleSide}));
  net.rotation.y=Math.PI/2;net.position.set(333.5-CX,2,129-CZ);scene.add(net);
  // swings and slide in the sand area
  [470,540].forEach(x=>{box(0.4,6,0.4,x,3,181,blue);box(0.4,6,0.4,x+12,3,181,blue);box(12.4,0.4,0.4,x+6,6,181,blue);});
  box(3,4,3,512,2,183,new THREE.MeshLambertMaterial({color:0xe4a72e}));
  // trees
  const leaf=new THREE.MeshLambertMaterial({color:0x4a9446}),leaf2=new THREE.MeshLambertMaterial({color:0x7aa83c}),trunk=new THREE.MeshLambertMaterial({color:0x7a5536});

  const ring=new THREE.Mesh(new THREE.RingGeometry(3,4,24),new THREE.MeshBasicMaterial({color:0x1f4fd1,depthTest:false,transparent:true,opacity:.5,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2;ring.position.y=0.3;
  [body,head,ring].forEach(o=>{o.renderOrder=13;walker.add(o);});walker.scale.setScalar(1.6);})();
let follow={s:0,playing:false,last:0};
function stepFollow(t){
  if(!route||route.view!=='follow'||!route.seg)return;
  const dt=Math.min(0.05,(t-follow.last)/1000);follow.last=t;
  if(follow.playing){follow.s=Math.min(route.len,follow.s+dt*(reduce?400:55));if(follow.s>=route.len){follow.playing=false;syncFollowUI();}}
  const {p,g}=along(follow.s);walker.position.copy(p);
  const dir=g[1].clone().sub(g[0]);dir.y=0;if(dir.lengthSq()<0.01)dir.copy(follow.dir||new THREE.Vector3(0,0,-1));dir.normalize();
  follow.dir=follow.dir?follow.dir.lerp(dir,0.08).normalize():dir;
  if(route.cur!==g[4]){route.cur=g[4];markStage();}
  const camT=p.clone().add(follow.dir.clone().multiplyScalar(12));const camP=p.clone().sub(follow.dir.clone().multiplyScalar(115)).add(new THREE.Vector3(0,95,0));
  if(follow.playing||follow.snap){controls.target.lerp(camT,follow.snap?1:0.1);camera.position.lerp(camP,follow.snap?1:0.08);follow.snap=false;}
}

// ===== stage list and view controls =====
function routeFloors(){const s=new Set();route.pts.forEach(p=>{if(p.y===undefined)s.add(p.f);});return s;}
function markStage(){navOut.querySelectorAll('li').forEach((li,i)=>li.classList.toggle('on',route.view!=='all'&&i===route.cur));
  const sc=document.getElementById('stageCount');if(sc)sc.textContent=route.view==='step'?`${route.cur+1} / ${route.stages.length}`:'';
  layout();}
function frame(stageIdx){
  const box=new THREE.Box3();
  (route.P||[]).forEach((p,i)=>{if(stageIdx<0||route.pts[i].s===stageIdx||(i+1<route.pts.length&&route.pts[i+1].s===stageIdx))box.expandByPoint(p);});
  if(box.isEmpty())return;const c=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3()).length();
  flyCam(c,c.clone().add(new THREE.Vector3(-0.25,0.85,0.75).normalize().multiplyScalar(Math.max(stageIdx<0?380:300,sz*(stageIdx<0?1.6:1.5)))));}
function setView(v){route.view=v;follow.playing=false;panel.dataset.view=v;
  if(v==='step'&&route.cur<0)route.cur=0;if(v==='all')route.cur=-1;
  if(v==='follow'){follow.s=0;follow.dir=null;follow.snap=true;follow.playing=true;route.cur=0;}
  navOut.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
  document.getElementById('stepCtl').hidden=v!=='step';document.getElementById('followCtl').hidden=v!=='follow';
  syncFollowUI();markStage();if(v!=='follow')frame(v==='step'?route.cur:-1);}
function goStage(d){route.cur=Math.max(0,Math.min(route.stages.length-1,route.cur+d));markStage();frame(route.cur);}
function syncFollowUI(){const b=document.getElementById('playBtn');if(b)b.textContent=follow.playing?'❚❚ 멈춤':(follow.s>=(route&&route.len||1)?'↺ 다시':'▶ 걷기');}
function showRoute(steps,color,evac,title){
  const {pts,stages}=buildStages(steps);
  route={steps,color,evac,pts,stages,view:'all',cur:-1};select(null);panel.classList.add('routing');openNav();
  if(mode==='ext'&&extOp>=0.95){overlay=true;ovIn.checked=true;setMode('plan',true);}
  active=-1;markFloor();
  const {m}=directions(steps,evac);
  const items=stages.map((st,i)=>{const x=stageText(st,i,route);const col=st.kind==='out'?'#5b6770':FLOORCOL[st.f];
    return `<li style="--fc:${col}" data-i="${i}"><span class="fl">${x.t}</span><span>${x.d}</span></li>`;}).join('');
  navOut.hidden=false;
  navOut.innerHTML=`<div class="navtop"><div class="navhead" style="--c:${color}">${title}<span>약 ${m}m · ${Math.max(1,Math.round(m/60))}분 · ${stages.length}단계</span></div><button class="btn" id="routeClose">닫기</button></div>
    <div class="floors viewsel"><button data-v="all">전체 경로</button><button data-v="step">단계별</button><button data-v="follow">따라가기</button></div>
    <div class="stepctl" id="stepCtl" hidden><button class="btn" id="prevSt">◀ 이전</button><span id="stageCount"></span><button class="btn primary" id="nextSt">다음 ▶</button></div>
    <div class="stepctl" id="followCtl" hidden><button class="btn primary" id="playBtn">▶ 걷기</button><button class="btn" id="restartBtn">처음부터</button></div>
    <ol class="stages">${items}</ol>`;
  navOut.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  navOut.querySelectorAll('li').forEach(li=>li.onclick=()=>{if(route.view==='follow'){const i=+li.dataset.i;const sg=route.seg.find(q=>q[4]===i);follow.s=sg?sg[2]:0;follow.snap=true;return;}
    if(route.view!=='step')setView('step');route.cur=+li.dataset.i;markStage();frame(route.cur);});
  document.getElementById('prevSt').onclick=()=>goStage(-1);document.getElementById('nextSt').onclick=()=>goStage(1);
  document.getElementById('playBtn').onclick=()=>{if(follow.s>=route.len)follow.s=0;follow.playing=!follow.playing;follow.snap=follow.playing;syncFollowUI();};
  document.getElementById('restartBtn').onclick=()=>{follow.s=0;follow.snap=true;follow.playing=true;syncFollowUI();};
  document.getElementById('routeClose').onclick=clearRoute;
  setView(stages.length>1?'step':'all');
}
function clearRoute(){route=null;routeG.clear();dots.length=0;navOut.hidden=true;panel.classList.remove('routing');
  if(phone.matches){document.getElementById('navBox').open=false;setCollapsed(true);}
  layout();}

// ===== directions text =====
const where=n=>n.kind==='room'?n.room.label:n.exit?n.exit:n.g.l?nice(key(n.g.l)):'복도';
function directions(steps,evac){
  const out=[];const s0=steps[0].n;out.push(`<b>${s0.f+1}F ${where(s0)}</b>에서 출발`);
  let i=1,walk=0;
  while(i<steps.length){const e=steps[i].e;
    if(e.vert){const f0=steps[i-1].n.f;let j=i;while(j+1<steps.length&&steps[j+1].e.vert===e.vert&&key(steps[j+1].e.name)===key(e.name))j++;
      const f1=steps[j].n.f;out.push(`${e.name}로 <b>${f0+1}F → ${f1+1}F</b> ${f1<f0?'내려가기':'올라가기'}`);i=j+1;continue;}
    if(e.out){out.push(`<b>${steps[i-1].n.exit}</b>로 나가 건물 밖으로 <b>${steps[i].n.exit}</b>까지 이동`);walk+=e.w/1.3;i++;continue;}
    walk+=e.w;i++;}
  const last=steps[steps.length-1].n;
  out.push(evac?`<b>${last.exit}</b>로 건물 밖 대피`:`<b>${last.f+1}F ${where(last)}</b> 도착`);
  const floorsMoved=steps.filter(s=>s.e&&s.e.vert).length;
  const m=Math.round(walk*0.18+floorsMoved*7);
  return {html:out.map(x=>`<li>${x}</li>`).join(''),m};
}

// ===== route finding UI =====
const navFrom=document.getElementById('navFrom'),navTo=document.getElementById('navTo'),navOut=document.getElementById('navOut');
// class numbers in the ways parents type them: 5-3, 5-3반, 5학년 3반, 5.3, 53, 510 → 5-3 / 5-10
function norm(s){s=s.replace(/\s/g,'').toLowerCase();
  const m=s.match(/^([1-6])(?:학년|[-.·_/])?(\d{1,2})반?$/);
  return m?`${m[1]}-${+m[2]}`:s.replace(/(\d)학년(\d+)반?/,'$1-$2');}
// everyday names for rooms the 배치도 names differently
const ALIAS={도서관:'도서미디어실',도서실:'도서미디어실',강당:'체육관',엘리베이터:'승강기',엘베:'승강기',
  위클래스:'wee클래스',특수학급:'학습탐구반',특수반:'학습탐구반',도움반:'학습탐구반',전산실:'컴퓨터실',
  주차장:'필로티(주차장)',돌봄교실:'돌봄',늘봄교실:'늘봄',정문:'중앙현관',입구:'중앙현관',운동장:'중앙현관',
  유치원:'병설유치원',급식소:'급식실',밥먹는곳:'급식실'};
const named=rooms.filter(r=>r.g.l&&r.g.c!==HALL);
// one matcher for both the search box and the route inputs: exact name, then part of a name,
// then category (병설유치원) or a room's note (분실물 → 로비)
function searchRooms(text){let v=norm(text);if(!v)return[];if(ALIAS[v])v=norm(ALIAS[v]);
  const ex=named.filter(r=>norm(r.g.l)===v||norm(r.label)===v);if(ex.length)return ex;
  const part=named.filter(r=>norm(r.g.l).includes(v)||norm(r.label).includes(v));if(part.length)return part;
  return named.filter(r=>norm(r.cat).includes(v)||(r.g.n&&norm(r.g.n).includes(v)));}
const placeNode=r=>r.node||walkCells.find(n=>n.room===r);
function findPlaces(text){const v=norm(text);if(!v)return[];
  const ex=walkCells.filter(n=>n.exit&&norm(n.exit).startsWith(v));if(ex.length&&/^현관./.test(v))return ex;
  if(v==='화장실'||v==='화장')return roomNodes.filter(n=>n.room.cat==='화장실'&&!/교화|장\.화/.test(n.g.l));
  return [...new Set(searchRooms(text).map(placeNode).filter(Boolean))];}
const dl=document.getElementById('places');
[...new Set(['중앙현관','로비','화장실',...EXITS.map(n=>n.exit),...rooms.filter(r=>r.node).map(r=>r.label)])].forEach(l=>dl.insertAdjacentHTML('beforeend',`<option value="${l}">`));
function runNav(){
  const A=findPlaces(navFrom.value),B=findPlaces(navTo.value);
  if(!A.length||!B.length){navOut.hidden=false;navOut.innerHTML=`<p class="hint">${!A.length?'출발':'도착'} 장소를 찾지 못했어요. 목록에서 골라 주세요.</p>`;return;}
  const res=dijkstra(A[0]);const t=B.reduce((a,b)=>res.d[b.id]<res.d[a.id]?b:a);
  if(!isFinite(res.d[t.id])){navOut.hidden=false;navOut.innerHTML='<p class="hint">두 곳을 잇는 길을 찾지 못했어요.</p>';return;}
  showRoute(pathTo(res,t),'#e8335f',false,'길 안내');}
document.getElementById('navGo').onclick=runNav;
document.getElementById('navSwap').onclick=()=>{[navFrom.value,navTo.value]=[navTo.value,navFrom.value];if(route&&!route.evac)runNav();};
document.getElementById('navClear').onclick=clearRoute;
[navFrom,navTo].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')runNav();}));

// ===== emergency evacuation =====
// Official routes per class go here once the school sends them, e.g. EVAC['5-3']=['계단3','현관③(계단3)'].
// Each entry lists places to pass through in order (stair names or exit names). Until then a provisional
// route to the nearest ground-floor exit is shown (stairs only, no lift).
const EVAC={};
function evacuate(room){
  const src=room.node;if(!src)return;
  const plan=EVAC[room.g.l];let steps=null,official=false;
  if(plan&&plan.length){let cur=src;steps=[];official=true;
    for(const name of plan){const cands=walkCells.filter(n=>(n.exit&&key(n.exit).startsWith(key(name)))||(n.kind==='stair'&&key(n.g.l)===key(name)));
      const res=dijkstra(cur,{noLift:true});const t=cands.reduce((a,b)=>res.d[b.id]<res.d[a.id]?b:a,cands[0]);if(!t)break;
      const seg=pathTo(res,t);steps.push(...(steps.length?seg.slice(1):seg));cur=t;}
    if(!steps.length||!steps[steps.length-1].n.exit){const res=dijkstra(cur,{noLift:true});const t=EXITS.reduce((a,b)=>res.d[b.id]<res.d[a.id]?b:a);
      const seg=pathTo(res,t);steps.push(...seg.slice(1));}}
  else{const res=dijkstra(src,{noLift:true});const t=EXITS.reduce((a,b)=>res.d[b.id]<res.d[a.id]?b:a);steps=pathTo(res,t);}
  showRoute(steps,'#13a053',true,official?`${room.label} 비상대피로`:`${room.label} 비상대피로 <em>(임시: 가장 가까운 출구)</em>`);
}

// ===== picking =====
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=document.getElementById('tip'),card=document.getElementById('card');
function pick(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mouse,camera);
  const vis=m=>{let o=m;while(o){if(!o.visible)return false;o=o.parent;}return true;};
  const hit=ray.intersectObjects(pickables.filter(m=>vis(m)&&m.material.opacity>0.5),false)[0];return hit&&hit.object.userData.room;}
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const r=pick(e);
  if(r&&r.g.l){tip.hidden=false;tip.textContent=`${r.floor+1}F · ${r.label}`;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';renderer.domElement.style.cursor='pointer';}
  else{tip.hidden=true;renderer.domElement.style.cursor='';}});
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;const r=pick(e);select(r&&r.g.l?r:null);});
function select(r,fly_){if(selected)selected.mat.emissive.setHex(0);selected=r;
  if(!r){card.hidden=true;return;}
  card.hidden=false;
  card.style.borderLeft=`6px solid ${r.color}`;
  card.innerHTML=`<small>${r.floor+1}층 · ${r.grade?r.grade+'학년 교실':r.cat}</small><b>${r.label}</b>${r.g.s?`<small style="color:#d62020;font-weight:700">${r.g.s} 교실 겸용</small>`:''}${r.g.n?`<small style="display:block">${r.g.n}</small>`:''}
    ${r.node?`<div class="cardbtns"><button data-a="from">여기서 출발</button><button data-a="to">여기로 가기</button>${r.cat==='화장실'||r.cat==='계단'||r.lobby?'':'<button data-a="evac" class="evac">비상대피로</button>'}</div>`:''}`;
  card.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='evac'){evacuate(r);return;}
    openNav();(b.dataset.a==='from'?navFrom:navTo).value=r.label;
    // visitors come in through the main entrance, so that is the start unless one was chosen
    if(b.dataset.a==='to'&&!navFrom.value&&MAINDOOR.room)navFrom.value=MAINDOOR.room.label;
    if(navFrom.value&&navTo.value)runNav();else(b.dataset.a==='from'?navTo:navFrom).focus();});
  if(fly_){const m=r.meshes[0];const p=new THREE.Vector3();m.getWorldPosition(p);flyTo(p,300);}}
function openNav(){if(panel.hidden)setMenu(true);document.getElementById('navBox').open=true;if(panel.classList.contains('collapsed'))tg.click();}

// search
const q=document.getElementById('q'),hint=document.getElementById('hint');
q.addEventListener('input',()=>{const v=norm(q.value);if(!v){hint.textContent='';return;}
  // a whole grade: say which floors its classes are on
  const gm=v.match(/^([1-6])학년$/);
  if(gm){const cl=rooms.filter(r=>r.grade===+gm[1]).sort((a,b)=>+a.g.l.split('-')[1]-b.g.l.split('-')[1]),byF={};
    cl.forEach(r=>(byF[r.floor+1]=byF[r.floor+1]||[]).push(r.g.l));
    hint.textContent=`${gm[1]}학년 ${cl.length}개 반 · `+Object.entries(byF).map(([f,a])=>`${f}F ${a.length>1?a[0]+'~'+a[a.length-1]:a[0]}`).join(' · ');
    if(mode!=='plan')setMode('plan',true);select(null);setFloor(-1);return;}
  const res=searchRooms(q.value);
  if(!res.length){hint.textContent='찾는 곳이 없어요. 반 번호(5-3)나 실 이름(보건실)으로 검색해 보세요.';return;}
  const hit=res.find(r=>r.floor===active)||res[0];
  hint.textContent=res.length>1?`${res.length}곳 중 ${hit.floor+1}F ${hit.label} 표시`:`${hit.floor+1}F ${hit.label}`;
  if(mode!=='plan')setMode('plan',true);
  active=hit.floor;markFloor();layout();select(hit,true);});
q.addEventListener('keydown',e=>{if(e.key==='Enter')q.blur();});

// mobile collapse
const tg=document.getElementById('tg'),panel=document.getElementById('panel');
const phone=matchMedia('(max-width:640px)');
function setCollapsed(c){panel.classList.toggle('collapsed',c);tg.textContent=c?'펼치기':'접기';tg.setAttribute('aria-expanded',String(!c));}

const showMenu=document.getElementById('showMenu');

document.getElementById('hideMenu').onclick=()=>setMenu(false);showMenu.onclick=()=>setMenu(true);
// iOS keeps the layout viewport under the on-screen keyboard: lift the bottom sheet above it
if(window.visualViewport){const vv=visualViewport,kb=()=>{document.documentElement.style.setProperty('--kb',
  Math.max(0,document.documentElement.clientHeight-vv.height-vv.offsetTop)+'px');watchCover();};
  vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb);}

// on phones the sheet covers the bottom and the room card the top: shift the picture so the camera
// target sits in the middle of the part of the screen that is still visible
const view={cur:0,to:0};
function coverShift(){if(!phone.matches)return 0;
  const top=card.hidden?0:card.getBoundingClientRect().bottom,bot=panel.hidden?0:innerHeight-panel.getBoundingClientRect().top;
  return Math.round((Math.max(0,bot)-top)/2);}
function applyView(){const w=innerWidth,h=innerHeight;if(Math.abs(view.cur)<0.5)camera.clearViewOffset();else camera.setViewOffset(w,h,0,view.cur,w,h);}
const watchCover=()=>{view.to=coverShift();};
new ResizeObserver(watchCover).observe(panel);new ResizeObserver(watchCover).observe(card);

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();watchCover();view.cur=view.to;applyView();}
addEventListener('resize',resize);resize();
camera.position.set(30,230,420);controls.target.set(-50,45,-10);setMode('ext',true);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
renderer.setAnimationLoop(t=>{
  if(fly){fly.t=reduce?1:Math.min(1,fly.t+0.06);const k=1-Math.pow(1-fly.t,3);controls.target.lerpVectors(fly.a,fly.b,k);camera.position.lerpVectors(fly.pa,fly.pb,k);if(fly.t>=1)fly=null;}
  if(selected){const s=(Math.sin(t/250)+1)/2;selected.mat.emissive.setRGB(0.35*s,0.25*s,0);}
  if(view.cur!==view.to){view.cur=reduce||Math.abs(view.to-view.cur)<1?view.to:view.cur+(view.to-view.cur)*0.2;applyView();}
  animateDots(t);stepFollow(t);
  controls.update();renderer.render(scene,camera);});
